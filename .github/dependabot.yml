version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # these went ESM-only starting with the versions below; our test setup
      # is CommonJS (require), matching the adapter runtime itself. Revisit
      # if/when the test suite is migrated to ESM.
      - dependency-name: "chai"
        versions: [">=5.0.0"]
      - dependency-name: "chai-as-promised"
        versions: [">=8.0.0"]
      - dependency-name: "sinon-chai"
        versions: [">=4.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
